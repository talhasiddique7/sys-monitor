
name: GNOME Extension CI & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            zip \
            unzip \
            gnome-shell \
            gnome-shell-extensions \
            libglib2.0-bin \
            gettext
      
      - name: Verify dependencies
        run: |
          command -v jq
          command -v zip
          command -v unzip
          command -v gnome-extensions
          command -v glib-compile-schemas
          command -v msgfmt

      - name: Validate metadata
        run: |
          jq empty metadata.json
          jq -e '.uuid and .version' metadata.json

      - name: Run production build
        run: make production

      - name: Verify ZIP artifacts
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(dist/*.zip)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No ZIP artifacts found!"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Verifying: $file"
            unzip -t "$file"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnome-extension-build
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      # Only release successful pushes to main.
      - name: Generate release tag
        if: github.event_name == 'push'
        id: release
        run: |
          VERSION=$(jq -r '.version' metadata.json)
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG} already exists."
            echo "Increment metadata.json version before releasing."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Created tag: $TAG"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.zip
          fail_on_unmatched_files: true
